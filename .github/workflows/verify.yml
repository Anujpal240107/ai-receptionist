name: Native receptionist checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_services -v
      - run: python -m scripts.audit_dependencies
      - run: python -m compileall -q app.py ugly_services
# Hosted integration uses isolated disposable accounts via the private operator runner.
# No production keys or database password are stored in this public workflow.

